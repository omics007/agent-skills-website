/* ==========================================================================
   Agent Skills v3 - Complete Stylesheet
   Features: Login, Favorites, Tags, Themes, Share, Reviews
   ========================================================================== */

/* --------------------------------------------------------------------------
   CSS Variables & Theme Definitions
   -------------------------------------------------------------------------- */

/* Theme 1: Dark Minimal (Default) */
:root[data-theme="dark"] {
    --bg-primary: #0a0a0a;
    --bg-secondary: #111111;
    --bg-tertiary: #1a1a1a;
    --bg-glass: rgba(255, 255, 255, 0.03);
    --text-primary: #ffffff;
    --text-secondary: #888888;
    --text-muted: #555555;
    --accent-tesla: #e31937;
    --accent-spacex: #0057d9;
    --accent-neuralink: #8b5cf6;
    --accent-success: #10b981;
    --accent-warning: #f59e0b;
    --border-glass: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(255, 255, 255, 0.15);
    --gradient-hero: radial-gradient(ellipse at center top, rgba(227, 25, 55, 0.15) 0%, rgba(0, 87, 217, 0.08) 40%, transparent 70%);
    --gradient-text: linear-gradient(135deg, #ffffff 0%, #888888 100%);
    --gradient-accent: linear-gradient(135deg, #e31937 0%, #0057d9 100%);
    --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.4);
    --shadow-card-hover: 0 8px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(227, 25, 55, 0.1);
    --shadow-glow-red: 0 0 20px rgba(227, 25, 55, 0.4);
    --shadow-glow-blue: 0 0 20px rgba(0, 87, 217, 0.4);
    --font-family: 'Inter', system-ui, -apple-system, sans-serif;
    --theme-transition: 0.3s ease;
    --card-bg: var(--bg-secondary);
    --card-border: var(--border-glass);
}

/* Theme 2: Fresh Light (Apple Style) */
:root[data-theme="light"] {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f5f7;
    --bg-tertiary: #eaeaec;
    --bg-glass: rgba(0, 0, 0, 0.02);
    --text-primary: #1d1d1f;
    --text-secondary: #515154;
    --text-muted: #86868b;
    --accent-tesla: #0071e3;
    --accent-spacex: #bf5af2;
    --accent-neuralink: #34c759;
    --accent-success: #34c759;
    --accent-warning: #ff9500;
    --border-glass: rgba(0, 0, 0, 0.08);
    --border-hover: rgba(0, 0, 0, 0.15);
    --gradient-hero: radial-gradient(ellipse at center top, rgba(0, 113, 227, 0.08) 0%, rgba(191, 90, 242, 0.05) 40%, transparent 70%);
    --gradient-text: linear-gradient(135deg, #1d1d1f 0%, #515154 100%);
    --gradient-accent: linear-gradient(135deg, #0071e3 0%, #bf5af2 100%);
    --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.08);
    --shadow-card-hover: 0 8px 30px rgba(0, 0, 0, 0.12), 0 0 20px rgba(0, 113, 227, 0.1);
    --shadow-glow-red: 0 0 20px rgba(0, 113, 227, 0.3);
    --shadow-glow-blue: 0 0 20px rgba(191, 90, 242, 0.3);
    --font-family: 'SF Pro Display', 'Inter', system-ui, -apple-system, sans-serif;
    --theme-transition: 0.3s ease;
    --card-bg: #ffffff;
    --card-border: rgba(0, 0, 0, 0.06);
}

/* Theme 3: Cyberpunk */
:root[data-theme="cyberpunk"] {
    --bg-primary: #0d0221;
    --bg-secondary: #150535;
    --bg-tertiary: #1a0645;
    --bg-glass: rgba(0, 255, 245, 0.03);
    --text-primary: #ffffff;
    --text-secondary: #a0a0a0;
    --text-muted: #606060;
    --accent-tesla: #00fff5;
    --accent-spacex: #ff2a6d;
    --accent-neuralink: #f9f002;
    --accent-success: #00fff5;
    --accent-warning: #f9f002;
    --border-glass: rgba(0, 255, 245, 0.15);
    --border-hover: rgba(0, 255, 245, 0.3);
    --gradient-hero: radial-gradient(ellipse at center top, rgba(0, 255, 245, 0.15) 0%, rgba(255, 42, 109, 0.08) 40%, transparent 70%);
    --gradient-text: linear-gradient(135deg, #00fff5 0%, #ff2a6d 100%);
    --gradient-accent: linear-gradient(135deg, #00fff5 0%, #ff2a6d 100%);
    --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.5);
    --shadow-card-hover: 0 0 40px rgba(0, 255, 245, 0.3), 0 0 60px rgba(255, 42, 109, 0.2);
    --shadow-glow-red: 0 0 30px rgba(0, 255, 245, 0.5);
    --shadow-glow-blue: 0 0 30px rgba(255, 42, 109, 0.5);
    --font-family: 'Orbitron', 'Inter', monospace;
    --theme-transition: 0.3s ease;
    --card-bg: var(--bg-secondary);
    --card-border: 1px solid rgba(0, 255, 245, 0.2);
}

/* Theme 4: Warm Paper (Notion Style) */
:root[data-theme="warm"] {
    --bg-primary: #faf8f5;
    --bg-secondary: #f5f2ed;
    --bg-tertiary: #ebe7e0;
    --bg-glass: rgba(0, 0, 0, 0.02);
    --text-primary: #2d2a26;
    --text-secondary: #6b6560;
    --text-muted: #9c9690;
    --accent-tesla: #c4956a;
    --accent-spacex: #2d6a4f;
    --accent-neuralink: #c44536;
    --accent-success: #2d6a4f;
    --accent-warning: #c4956a;
    --border-glass: rgba(0, 0, 0, 0.06);
    --border-hover: rgba(0, 0, 0, 0.12);
    --gradient-hero: radial-gradient(ellipse at center top, rgba(196, 149, 106, 0.1) 0%, rgba(45, 106, 79, 0.05) 40%, transparent 70%);
    --gradient-text: linear-gradient(135deg, #2d2a26 0%, #6b6560 100%);
    --gradient-accent: linear-gradient(135deg, #c4956a 0%, #2d6a4f 100%);
    --shadow-card: 0 1px 8px rgba(0, 0, 0, 0.06);
    --shadow-card-hover: 0 4px 20px rgba(0, 0, 0, 0.1);
    --shadow-glow-red: 0 0 20px rgba(196, 149, 106, 0.3);
    --shadow-glow-blue: 0 0 20px rgba(45, 106, 79, 0.3);
    --font-family: 'Noto Serif SC', Georgia, serif;
    --theme-transition: 0.3s ease;
    --card-bg: #ffffff;
    --card-border: rgba(0, 0, 0, 0.06);
}

/* Base Variables */
:root {
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 32px;
    --space-2xl: 48px;
    --space-3xl: 64px;
    --space-4xl: 80px;
    --radius-sm: 6px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 24px;
    --radius-full: 9999px;
    --transition-fast: 150ms ease;
    --transition-normal: 300ms ease;
    --transition-slow: 500ms ease;
    --max-width: 1400px;
    --nav-height: 72px;
}

/* Transition for theme changes */
body {
    transition: background-color var(--theme-transition), color var(--theme-transition);
}

/* Reset */
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

body {
    font-family: var(--font-family);
    font-size: 16px;
    line-height: 1.6;
    color: var(--text-primary);
    background-color: var(--bg-primary);
    min-height: 100vh;
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
    transition: color var(--transition-fast);
}

button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
}

ul, ol {
    list-style: none;
}

img {
    max-width: 100%;
    display: block;
}

input, textarea {
    font-family: inherit;
    border: none;
    outline: none;
    background: none;
    color: inherit;
}

/* Selection */
::selection {
    background: rgba(227, 25, 55, 0.3);
    color: var(--text-primary);
}

/* Scrollbar */
::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: var(--bg-secondary);
}

::-webkit-scrollbar-thumb {
    background: var(--bg-tertiary);
    border-radius: var(--radius-full);
}

::-webkit-scrollbar-thumb:hover {
    background: var(--text-muted);
}

/* Focus */
:focus-visible {
    outline: 2px solid var(--accent-tesla);
    outline-offset: 2px;
}

/* --------------------------------------------------------------------------
   Navigation
   -------------------------------------------------------------------------- */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--nav-height);
    z-index: 1000;
    transition: background var(--transition-normal), backdrop-filter var(--transition-normal);
}

.navbar.scrolled {
    background: rgba(17, 17, 17, 0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-glass);
}

.nav-container {
    max-width: var(--max-width);
    height: 100%;
    margin: 0 auto;
    padding: 0 var(--space-4xl);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.nav-logo {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
}

.logo-icon {
    width: 36px;
    height: 36px;
}

.logo-accent {
    color: var(--accent-tesla);
}

.nav-links {
    display: flex;
    align-items: center;
    gap: var(--space-xl);
}

.nav-link {
    position: relative;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    padding: var(--space-sm) 0;
    transition: color var(--transition-fast);
}

.nav-link::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--gradient-accent);
    transition: width var(--transition-normal);
}

.nav-link:hover,
.nav-link.active {
    color: var(--text-primary);
}

.nav-link.active::after,
.nav-link:hover::after {
    width: 100%;
}

/* Nav Actions */
.nav-actions {
    display: flex;
    align-items: center;
    gap: var(--space-md);
}

.nav-btn {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-full);
    color: var(--text-secondary);
    transition: all var(--transition-fast);
}

.nav-btn:hover {
    color: var(--text-primary);
    background: var(--bg-glass);
}

/* User Menu */
.user-menu {
    position: relative;
}

.user-avatar-btn {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    padding: var(--space-xs) var(--space-md);
    padding-right: var(--space-sm);
    background: var(--bg-glass);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-full);
    transition: all var(--transition-fast);
}

.user-avatar-btn:hover {
    border-color: var(--border-hover);
    background: var(--bg-tertiary);
}

.user-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--gradient-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    color: white;
    overflow: hidden;
}

.user-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.user-name {
    font-size: 14px;
    font-weight: 500;
    max-width: 100px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.user-dropdown-icon {
    width: 20px;
    height: 20px;
    color: var(--text-muted);
}

.user-dropdown {
    position: absolute;
    top: calc(100% + var(--space-sm));
    right: 0;
    min-width: 180px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: all var(--transition-fast);
    z-index: 100;
}

.user-dropdown.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.user-dropdown-item {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    padding: var(--space-sm) var(--space-md);
    font-size: 14px;
    color: var(--text-secondary);
    transition: all var(--transition-fast);
    cursor: pointer;
}

.user-dropdown-item:first-child {
    border-radius: var(--radius-md) var(--radius-md) 0 0;
}

.user-dropdown-item:last-child {
    border-radius: 0 0 var(--radius-md) var(--radius-md);
}

.user-dropdown-item:hover {
    background: var(--bg-tertiary);
    color: var(--text-primary);
}

.user-dropdown-item.danger:hover {
    background: rgba(227, 25, 55, 0.1);
    color: var(--accent-tesla);
}

.user-dropdown-divider {
    height: 1px;
    background: var(--border-glass);
    margin: var(--space-xs) 0;
}

/* Login Button */
.login-btn {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    padding: var(--space-sm) var(--space-md);
    background: var(--accent-tesla);
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 600;
    color: white;
    transition: all var(--transition-fast);
}

.login-btn:hover {
    box-shadow: var(--shadow-glow-red);
    transform: translateY(-2px);
}

.nav-search {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-full);
    color: var(--text-secondary);
    transition: all var(--transition-fast);
}

.nav-search:hover {
    color: var(--text-primary);
    background: var(--bg-glass);
}

.nav-menu-btn {
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 40px;
    height: 40px;
    gap: 5px;
}

.nav-menu-btn span {
    display: block;
    width: 20px;
    height: 2px;
    background: var(--text-primary);
    border-radius: 2px;
    transition: all var(--transition-fast);
}

/* Mobile Menu */
.mobile-menu {
    position: fixed;
    top: 0;
    right: -100%;
    width: 280px;
    height: 100vh;
    background: var(--bg-secondary);
    z-index: 999;
    transition: right var(--transition-normal);
    padding-top: var(--nav-height);
}

.mobile-menu.open {
    right: 0;
}

.mobile-menu-content {
    padding: var(--space-lg);
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
}

.mobile-link {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-md);
    border-radius: var(--radius-md);
    font-size: 16px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: all var(--transition-fast);
}

.mobile-link:hover,
.mobile-link.active {
    color: var(--text-primary);
    background: var(--bg-glass);
}

/* Search Overlay */
.search-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(10, 10, 10, 0.95);
    backdrop-filter: blur(20px);
    z-index: 1001;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 15vh;
    opacity: 0;
    visibility: hidden;
    transition: all var(--transition-normal);
}

.search-overlay.open {
    opacity: 1;
    visibility: visible;
}

.search-container {
    width: 100%;
    max-width: 640px;
    padding: 0 var(--space-lg);
}

.search-input-wrapper {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-md) var(--space-lg);
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-lg);
    transition: border-color var(--transition-fast);
}

.search-input-wrapper:focus-within {
    border-color: var(--accent-tesla);
}

.search-input-wrapper svg {
    color: var(--text-muted);
    flex-shrink: 0;
}

.search-input {
    flex: 1;
    font-size: 18px;
    color: var(--text-primary);
}

.search-input::placeholder {
    color: var(--text-muted);
}

.search-close {
    padding: var(--space-xs);
    color: var(--text-muted);
    transition: color var(--transition-fast);
}

.search-close:hover {
    color: var(--text-primary);
}

.search-results {
    margin-top: var(--space-lg);
    max-height: 60vh;
    overflow-y: auto;
}

.search-section {
    margin-bottom: var(--space-lg);
}

.search-section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: var(--space-sm);
    padding-left: var(--space-sm);
}

.search-result-item {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-md);
    border-radius: var(--radius-md);
    transition: background var(--transition-fast);
}

.search-result-item:hover {
    background: var(--bg-glass);
}

.search-result-icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-tertiary);
    border-radius: var(--radius-md);
    font-size: 20px;
}

.search-result-info {
    flex: 1;
    min-width: 0;
}

.search-result-name {
    display: block;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.search-result-meta {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
}

/* --------------------------------------------------------------------------
   Hero Section
   -------------------------------------------------------------------------- */
.hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: calc(var(--nav-height) + var(--space-4xl)) var(--space-lg) var(--space-4xl);
    position: relative;
    overflow: hidden;
}

.hero::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--gradient-hero);
    pointer-events: none;
}

.hero::after {
    content: '';
    position: absolute;
    top: -50%;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(227, 25, 55, 0.1) 0%, transparent 60%);
    pointer-events: none;
    animation: pulse 8s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.1); }
}

.hero-content {
    position: relative;
    z-index: 1;
    max-width: 800px;
}

.hero-badge {
    display: inline-flex;
    align-items: center;
    gap: var(--space-sm);
    padding: var(--space-sm) var(--space-md);
    background: var(--bg-glass);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-full);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: var(--space-xl);
    animation: fadeInUp 0.8s ease-out;
}

.hero-badge-dot {
    width: 6px;
    height: 6px;
    background: var(--accent-success);
    border-radius: 50%;
    animation: blink 2s ease-in-out infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.hero-title {
    font-size: clamp(40px, 8vw, 72px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin-bottom: var(--space-lg);
    animation: fadeInUp 0.8s ease-out 0.1s both;
}

.hero-title-gradient {
    background: var(--gradient-text);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.hero-subtitle {
    font-size: clamp(16px, 2vw, 20px);
    font-weight: 400;
    color: var(--text-secondary);
    max-width: 560px;
    margin: 0 auto var(--space-2xl);
    animation: fadeInUp 0.8s ease-out 0.2s both;
}

.hero-search {
    position: relative;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    animation: fadeInUp 0.8s ease-out 0.3s both;
}

.hero-search-input {
    width: 100%;
    padding: var(--space-md) var(--space-lg);
    padding-left: 52px;
    padding-right: 140px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-lg);
    font-size: 16px;
    color: var(--text-primary);
    transition: all var(--transition-fast);
}

.hero-search-input:focus {
    border-color: var(--accent-tesla);
    box-shadow: var(--shadow-glow-red);
}

.hero-search-input::placeholder {
    color: var(--text-muted);
}

.hero-search-icon {
    position: absolute;
    left: var(--space-lg);
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
}

.hero-search-btn {
    position: absolute;
    right: var(--space-sm);
    top: 50%;
    transform: translateY(-50%);
    padding: var(--space-sm) var(--space-md);
    background: var(--accent-tesla);
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 600;
    color: white;
    transition: all var(--transition-fast);
}

.hero-search-btn:hover {
    box-shadow: var(--shadow-glow-red);
    transform: translateY(-50%) scale(1.02);
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* --------------------------------------------------------------------------
   Categories Section
   -------------------------------------------------------------------------- */
.categories {
    padding: var(--space-4xl) var(--space-4xl);
    background: var(--bg-secondary);
}

.section-container {
    max-width: var(--max-width);
    margin: 0 auto;
}

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-2xl);
}

.section-title {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.02em;
}

.section-link {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: color var(--transition-fast);
}

.section-link:hover {
    color: var(--accent-tesla);
}

.categories-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: var(--space-md);
}

.category-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-xl) var(--space-md);
    background: var(--bg-glass);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-lg);
    cursor: pointer;
    transition: all var(--transition-normal);
}

.category-card:hover {
    background: var(--bg-tertiary);
    border-color: var(--border-hover);
    transform: translateY(-4px);
}

.category-icon {
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(227, 25, 55, 0.1), rgba(0, 87, 217, 0.1));
    border-radius: var(--radius-md);
    font-size: 24px;
    transition: all var(--transition-fast);
}

.category-card:hover .category-icon {
    box-shadow: 0 0 30px rgba(227, 25, 55, 0.3);
}

.category-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
}

.category-count {
    font-size: 12px;
    color: var(--text-muted);
}

/* --------------------------------------------------------------------------
   Skills Grid
   -------------------------------------------------------------------------- */
.skills-section {
    padding: var(--space-4xl);
}

.skills-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-lg);
}

/* Skill Card */
.skill-card {
    position: relative;
    display: flex;
    flex-direction: column;
    padding: var(--space-lg);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    cursor: pointer;
    transition: all var(--transition-normal);
    overflow: hidden;
}

.skill-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--gradient-accent);
    opacity: 0;
    transition: opacity var(--transition-fast);
}

.skill-card:hover {
    background: var(--bg-tertiary);
    border-color: var(--border-hover);
    transform: translateY(-4px);
    box-shadow: var(--shadow-card-hover);
}

.skill-card:hover::before {
    opacity: 1;
}

/* Card Actions (Favorite & Share) */
.card-actions {
    position: absolute;
    top: var(--space-md);
    right: var(--space-md);
    display: flex;
    gap: var(--space-xs);
    opacity: 0;
    transition: opacity var(--transition-fast);
}

.skill-card:hover .card-actions {
    opacity: 1;
}

.card-action-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    transition: all var(--transition-fast);
}

.card-action-btn:hover {
    background: var(--bg-tertiary);
    color: var(--text-primary);
}

.card-action-btn.favorited {
    color: var(--accent-warning);
}

.card-action-btn.favorited svg {
    fill: var(--accent-warning);
}

/* Rating Badge on Card */
.card-rating {
    position: absolute;
    top: var(--space-md);
    left: var(--space-md);
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    padding: var(--space-xs) var(--space-sm);
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 500;
}

.card-rating svg {
    color: var(--accent-warning);
}

.skill-header {
    display: flex;
    align-items: flex-start;
    gap: var(--space-md);
    margin-bottom: var(--space-md);
    margin-top: var(--space-xl);
}

.skill-icon {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-tertiary);
    border-radius: var(--radius-md);
    font-size: 24px;
    flex-shrink: 0;
}

.skill-info {
    flex: 1;
    min-width: 0;
}

.skill-name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: var(--space-xs);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.skill-source {
    font-size: 12px;
    color: var(--text-muted);
}

.skill-description {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-bottom: var(--space-md);
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.skill-tags {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-sm);
    margin-bottom: var(--space-md);
}

.skill-tag {
    padding: var(--space-xs) var(--space-sm);
    background: var(--bg-tertiary);
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: all var(--transition-fast);
    cursor: pointer;
}

.skill-tag:hover {
    background: var(--accent-tesla);
    color: white;
}

.skill-tag.tag-ai {
    background: rgba(139, 92, 246, 0.15);
    color: var(--accent-neuralink);
}

.skill-tag.tag-dev {
    background: rgba(0, 87, 217, 0.15);
    color: var(--accent-spacex);
}

.skill-tag.tag-productivity {
    background: rgba(16, 185, 129, 0.15);
    color: var(--accent-success);
}

.skill-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: var(--space-md);
    border-top: 1px solid var(--border-glass);
}

.skill-stats {
    display: flex;
    gap: var(--space-md);
}

.skill-stat {
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    font-size: 12px;
    color: var(--text-muted);
}

.skill-stat svg {
    width: 14px;
    height: 14px;
}

.skill-action {
    padding: var(--space-sm) var(--space-md);
    background: var(--accent-tesla);
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 600;
    color: white;
    opacity: 0;
    transform: translateY(4px);
    transition: all var(--transition-fast);
}

.skill-card:hover .skill-action {
    opacity: 1;
    transform: translateY(0);
}

.skill-action:hover {
    box-shadow: var(--shadow-glow-red);
}

/* --------------------------------------------------------------------------
   News Section
   -------------------------------------------------------------------------- */
.news-section {
    padding: var(--space-4xl);
    background: var(--bg-secondary);
}

.news-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-lg);
}

.news-card {
    position: relative;
    display: flex;
    gap: var(--space-lg);
    padding: var(--space-lg);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    cursor: pointer;
    transition: all var(--transition-normal);
}

.news-card:hover {
    background: var(--bg-tertiary);
    border-color: var(--border-hover);
    transform: translateY(-2px);
}

.news-card .card-actions {
    opacity: 1;
}

.news-image {
    width: 160px;
    height: 120px;
    background: linear-gradient(135deg, rgba(227, 25, 55, 0.2), rgba(0, 87, 217, 0.2));
    border-radius: var(--radius-md);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
}

.news-content {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.news-category {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-tesla);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: var(--space-sm);
}

.news-title {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: var(--space-sm);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.news-summary {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: var(--space-md);
    flex: 1;
}

.news-meta {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    font-size: 12px;
    color: var(--text-muted);
}

/* --------------------------------------------------------------------------
   Tutorials Section
   -------------------------------------------------------------------------- */
.tutorials-section {
    padding: var(--space-4xl);
}

.tutorials-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-lg);
}

.tutorial-card {
    position: relative;
    padding: var(--space-lg);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    cursor: pointer;
    transition: all var(--transition-normal);
}

.tutorial-card:hover {
    background: var(--bg-tertiary);
    border-color: var(--border-hover);
    transform: translateY(-4px);
    box-shadow: var(--shadow-card-hover);
}

.tutorial-card .card-actions {
    opacity: 1;
}

.tutorial-header {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    margin-bottom: var(--space-md);
}

.tutorial-icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-tertiary);
    border-radius: var(--radius-md);
    font-size: 20px;
}

.tutorial-meta {
    display: flex;
    gap: var(--space-sm);
}

.tutorial-badge {
    padding: var(--space-xs) var(--space-sm);
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-weight: 600;
}

.tutorial-badge.difficulty-beginner {
    background: rgba(16, 185, 129, 0.15);
    color: var(--accent-success);
}

.tutorial-badge.difficulty-intermediate {
    background: rgba(0, 87, 217, 0.15);
    color: var(--accent-spacex);
}

.tutorial-badge.difficulty-advanced {
    background: rgba(227, 25, 55, 0.15);
    color: var(--accent-tesla);
}

.tutorial-badge.type-article {
    background: rgba(139, 92, 246, 0.15);
    color: var(--accent-neuralink);
}

.tutorial-badge.type-video {
    background: rgba(227, 130, 55, 0.15);
    color: #e38237;
}

.tutorial-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: var(--space-sm);
}

.tutorial-description {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: var(--space-md);
}

.tutorial-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-md);
    font-size: 12px;
    color: var(--text-muted);
}

.tutorial-duration {
    display: flex;
    align-items: center;
    gap: var(--space-xs);
}

.tutorial-platform {
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    padding: var(--space-xs) var(--space-sm);
    background: var(--bg-tertiary);
    border-radius: var(--radius-sm);
    font-size: 11px;
}

/* --------------------------------------------------------------------------
   Filter Tags Bar
   -------------------------------------------------------------------------- */
.filter-section {
    padding: var(--space-md) var(--space-4xl);
    background: var(--bg-primary);
    border-bottom: 1px solid var(--border-glass);
}

.filter-section.collapsible .filter-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    padding: var(--space-sm) 0;
}

.filter-section.collapsible .filter-section-header:hover {
    color: var(--text-primary);
}

.filter-section.collapsed .filter-section-content {
    display: none;
}

.filter-section-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: var(--space-sm);
}

.filter-section.collapsed .filter-section-title {
    margin-bottom: 0;
}

.filter-chevron {
    width: 20px;
    height: 20px;
    color: var(--text-muted);
    transition: transform var(--transition-fast);
}

.filter-section.collapsed .filter-chevron {
    transform: rotate(-90deg);
}

.filter-tags {
    display: flex;
    gap: var(--space-sm);
    flex-wrap: wrap;
}

.filter-tag {
    padding: var(--space-xs) var(--space-md);
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-full);
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition-fast);
}

.filter-tag:hover {
    border-color: var(--border-hover);
    color: var(--text-primary);
}

.filter-tag.active {
    background: var(--accent-tesla);
    border-color: var(--accent-tesla);
    color: white;
}

.filter-tag.active:hover {
    background: var(--accent-tesla);
    opacity: 0.9;
}

/* Source Tags with Icons */
.filter-tag[data-source] {
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
}

.filter-tag[data-source]::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
}

.filter-tag[data-source="Coze"]::before { background: #00b8ab; }
.filter-tag[data-source="SkillsMP"]::before { background: #e31937; }
.filter-tag[data-source="虾评"]::before { background: #4c6ef5; }
.filter-tag[data-source="Skills.sh"]::before { background: #10b981; }

/* --------------------------------------------------------------------------
   Page Header & Filters
   -------------------------------------------------------------------------- */
.page-header {
    padding: calc(var(--nav-height) + var(--space-3xl)) var(--space-4xl) var(--space-2xl);
    background: var(--bg-secondary);
    text-align: center;
}

.page-title {
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: var(--space-md);
}

.page-subtitle {
    font-size: 18px;
    color: var(--text-secondary);
    max-width: 600px;
    margin: 0 auto;
}

.filters-bar {
    padding: var(--space-lg) var(--space-4xl);
    background: var(--bg-primary);
    border-bottom: 1px solid var(--border-glass);
    position: sticky;
    top: var(--nav-height);
    z-index: 100;
}

.filters-container {
    max-width: var(--max-width);
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-lg);
    flex-wrap: wrap;
}

.filter-group {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    flex-wrap: wrap;
}

.filter-label {
    font-size: 13px;
    color: var(--text-muted);
}

.filter-select {
    padding: var(--space-sm) var(--space-md);
    padding-right: var(--space-xl);
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-md);
    font-size: 13px;
    color: var(--text-primary);
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='%23888888' stroke-width='2' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 12px center;
    transition: all var(--transition-fast);
}

.filter-select:hover {
    border-color: var(--border-hover);
}

.filter-select:focus {
    border-color: var(--accent-tesla);
}

.results-count {
    font-size: 13px;
    color: var(--text-muted);
}

.skills-market-content {
    padding: var(--space-2xl) var(--space-4xl);
}

/* --------------------------------------------------------------------------
   Detail Page
   -------------------------------------------------------------------------- */
.detail-page {
    padding-top: var(--nav-height);
}

.detail-hero {
    padding: var(--space-3xl) var(--space-4xl);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-glass);
}

.detail-container {
    max-width: var(--max-width);
    margin: 0 auto;
}

.detail-header {
    display: flex;
    align-items: flex-start;
    gap: var(--space-xl);
    margin-bottom: var(--space-2xl);
}

.detail-icon {
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-tertiary);
    border-radius: var(--radius-lg);
    font-size: 40px;
    flex-shrink: 0;
}

.detail-info {
    flex: 1;
}

.detail-title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-md);
}

.detail-title {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: var(--space-sm);
}

.detail-actions-row {
    display: flex;
    gap: var(--space-sm);
}

.detail-action-btn {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-md);
    color: var(--text-secondary);
    transition: all var(--transition-fast);
}

.detail-action-btn:hover {
    background: var(--bg-secondary);
    border-color: var(--border-hover);
    color: var(--text-primary);
}

.detail-action-btn.favorited {
    color: var(--accent-warning);
}

.detail-action-btn.favorited svg {
    fill: var(--accent-warning);
}

.detail-source {
    display: inline-flex;
    align-items: center;
    gap: var(--space-sm);
    padding: var(--space-sm) var(--space-md);
    background: var(--bg-tertiary);
    border-radius: var(--radius-full);
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: var(--space-md);
}

.detail-tags {
    display: flex;
    gap: var(--space-sm);
    flex-wrap: wrap;
}

.detail-description {
    font-size: 18px;
    color: var(--text-secondary);
    line-height: 1.7;
    max-width: 800px;
    margin-bottom: var(--space-2xl);
}

.detail-actions {
    display: flex;
    gap: var(--space-md);
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-sm);
    padding: var(--space-md) var(--space-xl);
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition-fast);
}

.btn-primary {
    background: var(--accent-tesla);
    color: white;
}

.btn-primary:hover {
    box-shadow: var(--shadow-glow-red);
    transform: translateY(-2px);
}

.btn-secondary {
    background: transparent;
    border: 1px solid var(--border-glass);
    color: var(--text-primary);
}

.btn-secondary:hover {
    background: var(--bg-tertiary);
    border-color: var(--border-hover);
}

.detail-content {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: var(--space-2xl);
    padding: var(--space-2xl) var(--space-4xl);
}

.detail-main {
    display: flex;
    flex-direction: column;
    gap: var(--space-2xl);
}

.detail-section {
    padding: var(--space-xl);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
}

.detail-section-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: var(--space-lg);
    display: flex;
    align-items: center;
    gap: var(--space-sm);
}

.detail-section-title svg {
    color: var(--accent-tesla);
}

.features-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
}

.feature-item {
    display: flex;
    align-items: flex-start;
    gap: var(--space-md);
    padding: var(--space-md);
    background: var(--bg-glass);
    border-radius: var(--radius-md);
}

.feature-icon {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent-success);
    border-radius: 50%;
    flex-shrink: 0;
}

.feature-icon svg {
    width: 14px;
    height: 14px;
    color: white;
}

.feature-text {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
}

.usage-content {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
}

.usage-content p {
    margin-bottom: var(--space-md);
}

.usage-content code {
    padding: 2px 6px;
    background: var(--bg-tertiary);
    border-radius: var(--radius-sm);
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    color: var(--accent-neuralink);
}

.detail-sidebar {
    display: flex;
    flex-direction: column;
    gap: var(--space-lg);
}

.sidebar-card {
    padding: var(--space-lg);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
}

.sidebar-card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: var(--space-md);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-md);
}

.stat-item {
    text-align: center;
    padding: var(--space-md);
    background: var(--bg-glass);
    border-radius: var(--radius-md);
}

.stat-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-primary);
}

.stat-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.related-skills {
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
}

.related-skill {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-sm);
    border-radius: var(--radius-md);
    transition: background var(--transition-fast);
    cursor: pointer;
}

.related-skill:hover {
    background: var(--bg-glass);
}

.related-skill-icon {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-tertiary);
    border-radius: var(--radius-sm);
    font-size: 18px;
}

.related-skill-info {
    flex: 1;
    min-width: 0;
}

.related-skill-name {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.related-skill-source {
    font-size: 11px;
    color: var(--text-muted);
}

/* --------------------------------------------------------------------------
   News & Tutorials Pages
   -------------------------------------------------------------------------- */
.news-list,
.tutorials-list,
.favorites-list {
    padding: var(--space-2xl) var(--space-4xl);
    max-width: var(--max-width);
    margin: 0 auto;
}

.news-list .news-grid,
.favorites-list .news-grid {
    grid-template-columns: repeat(2, 1fr);
}

.tutorials-list .tutorials-grid,
.favorites-list .tutorials-grid {
    grid-template-columns: repeat(3, 1fr);
}

.favorites-list .skills-grid {
    grid-template-columns: repeat(4, 1fr);
}

.news-full-card {
    position: relative;
    padding: var(--space-lg);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    cursor: pointer;
    transition: all var(--transition-normal);
    margin-bottom: var(--space-lg);
}

.news-full-card:hover {
    background: var(--bg-tertiary);
    border-color: var(--border-hover);
    transform: translateY(-2px);
}

.news-full-card .card-actions {
    opacity: 1;
}

/* --------------------------------------------------------------------------
   Settings Page
   -------------------------------------------------------------------------- */
.settings-page {
    padding-top: var(--nav-height);
}

.settings-container {
    max-width: 800px;
    margin: 0 auto;
    padding: var(--space-2xl) var(--space-lg);
}

.settings-header {
    margin-bottom: var(--space-2xl);
}

.settings-title {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: var(--space-sm);
}

.settings-subtitle {
    font-size: 16px;
    color: var(--text-secondary);
}

.settings-section {
    margin-bottom: var(--space-2xl);
}

.settings-section-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: var(--space-lg);
    padding-bottom: var(--space-md);
    border-bottom: 1px solid var(--border-glass);
}

/* Theme Cards */
.theme-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-lg);
}

.theme-card {
    padding: var(--space-lg);
    background: var(--bg-secondary);
    border: 2px solid var(--border-glass);
    border-radius: var(--radius-lg);
    cursor: pointer;
    transition: all var(--transition-fast);
}

.theme-card:hover {
    border-color: var(--border-hover);
}

.theme-card.active {
    border-color: var(--accent-tesla);
}

.theme-preview {
    height: 120px;
    border-radius: var(--radius-md);
    margin-bottom: var(--space-md);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.theme-preview-dark {
    background: linear-gradient(135deg, #0a0a0a 0%, #111111 100%);
}

.theme-preview-light {
    background: linear-gradient(135deg, #ffffff 0%, #f5f5f7 100%);
}

.theme-preview-cyberpunk {
    background: linear-gradient(135deg, #0d0221 0%, #150535 100%);
}

.theme-preview-warm {
    background: linear-gradient(135deg, #faf8f5 0%, #f0ebe3 100%);
}

.theme-preview-card {
    width: 60%;
    height: 60px;
    border-radius: 8px;
}

.theme-preview-dark .theme-preview-card {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.theme-preview-light .theme-preview-card {
    background: #ffffff;
    border: 1px solid rgba(0, 0, 0, 0.06);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.theme-preview-cyberpunk .theme-preview-card {
    background: rgba(0, 255, 245, 0.1);
    border: 1px solid rgba(0, 255, 245, 0.2);
    box-shadow: 0 0 20px rgba(0, 255, 245, 0.2);
}

.theme-preview-warm .theme-preview-card {
    background: #ffffff;
    border: 1px solid rgba(0, 0, 0, 0.06);
}

.theme-name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: var(--space-xs);
}

.theme-desc {
    font-size: 13px;
    color: var(--text-muted);
}

/* Settings Form */
.settings-form {
    display: flex;
    flex-direction: column;
    gap: var(--space-lg);
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
}

.form-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
}

.form-input {
    padding: var(--space-md);
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-md);
    font-size: 14px;
    color: var(--text-primary);
    transition: border-color var(--transition-fast);
}

.form-input:focus {
    border-color: var(--accent-tesla);
}

.form-input::placeholder {
    color: var(--text-muted);
}

.form-help {
    font-size: 12px;
    color: var(--text-muted);
}

.form-help a {
    color: var(--accent-tesla);
}

.form-help a:hover {
    text-decoration: underline;
}

/* Data Sources List */
.data-sources-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
}

.data-source-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-md);
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-md);
}

.data-source-name {
    font-size: 14px;
    font-weight: 500;
}

.data-source-count {
    font-size: 12px;
    color: var(--text-muted);
}

/* Danger Zone */
.danger-zone {
    padding: var(--space-lg);
    background: rgba(227, 25, 55, 0.05);
    border: 1px solid rgba(227, 25, 55, 0.2);
    border-radius: var(--radius-lg);
}

.danger-zone .btn-danger {
    background: var(--accent-tesla);
    color: white;
}

.btn-danger {
    background: transparent;
    border: 1px solid var(--accent-tesla);
    color: var(--accent-tesla);
}

.btn-danger:hover {
    background: var(--accent-tesla);
    color: white;
}

/* --------------------------------------------------------------------------
   Modals
   -------------------------------------------------------------------------- */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-lg);
    opacity: 0;
    visibility: hidden;
    transition: all var(--transition-normal);
}

.modal-overlay.open {
    opacity: 1;
    visibility: visible;
}

.modal {
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transform: scale(0.95);
    transition: transform var(--transition-normal);
}

.modal-overlay.open .modal {
    transform: scale(1);
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-lg);
    border-bottom: 1px solid var(--border-glass);
}

.modal-title {
    font-size: 18px;
    font-weight: 600;
}

.modal-close {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    transition: all var(--transition-fast);
}

.modal-close:hover {
    background: var(--bg-tertiary);
    color: var(--text-primary);
}

.modal-body {
    padding: var(--space-lg);
    overflow-y: auto;
    max-height: calc(90vh - 140px);
}

/* Share Modal */
.share-platforms {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
}

.share-platform {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-sm);
    padding: var(--space-lg);
    background: var(--bg-tertiary);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all var(--transition-fast);
}

.share-platform:hover {
    background: var(--bg-glass);
    transform: translateY(-2px);
}

.share-platform-icon {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 24px;
}

.share-platform-icon.wechat { background: #07c160; }
.share-platform-icon.twitter { background: #1da1f2; }
.share-platform-icon.weibo { background: #e6162d; }
.share-platform-icon.link { background: var(--accent-tesla); }

.share-platform-name {
    font-size: 14px;
    font-weight: 500;
}

.share-divider {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
}

.share-divider::before,
.share-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-glass);
}

.share-divider span {
    font-size: 12px;
    color: var(--text-muted);
}

.qrcode-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-md);
}

.qrcode-container canvas,
.qrcode-container .qrcode {
    padding: var(--space-md);
    background: white;
    border-radius: var(--radius-md);
}

.share-link-input {
    display: flex;
    gap: var(--space-sm);
}

.share-link-input input {
    flex: 1;
    padding: var(--space-md);
    background: var(--bg-tertiary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-md);
    font-size: 14px;
}

.share-copy-btn {
    padding: var(--space-md) var(--space-lg);
    background: var(--accent-tesla);
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 600;
    color: white;
    transition: all var(--transition-fast);
}

.share-copy-btn:hover {
    box-shadow: var(--shadow-glow-red);
}

.share-copy-btn.copied {
    background: var(--accent-success);
}

/* --------------------------------------------------------------------------
   Reviews Modal
   -------------------------------------------------------------------------- */
.reviews-modal .modal {
    max-width: 640px;
}

.reviews-stats {
    display: flex;
    align-items: center;
    gap: var(--space-2xl);
    padding: var(--space-lg);
    background: var(--bg-tertiary);
    border-radius: var(--radius-lg);
    margin-bottom: var(--space-lg);
}

.reviews-average {
    text-align: center;
}

.reviews-average-value {
    font-size: 48px;
    font-weight: 700;
    line-height: 1;
    color: var(--text-primary);
}

.reviews-average-stars {
    display: flex;
    gap: 2px;
    margin-top: var(--space-sm);
}

.reviews-average-stars svg {
    width: 16px;
    height: 16px;
    color: var(--accent-warning);
}

.reviews-breakdown {
    flex: 1;
}

.reviews-breakdown-row {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
}

.reviews-breakdown-row span:first-child {
    width: 20px;
}

.reviews-breakdown-bar {
    flex: 1;
    height: 6px;
    background: var(--bg-secondary);
    border-radius: 3px;
    overflow: hidden;
}

.reviews-breakdown-bar-fill {
    height: 100%;
    background: var(--accent-warning);
    border-radius: 3px;
}

.reviews-count {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: var(--space-lg);
}

/* Write Review */
.write-review {
    padding: var(--space-lg);
    background: var(--bg-tertiary);
    border-radius: var(--radius-lg);
    margin-bottom: var(--space-lg);
}

.write-review-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-md);
}

.write-review-title {
    font-size: 14px;
    font-weight: 600;
}

.login-prompt {
    font-size: 13px;
    color: var(--text-secondary);
}

.login-prompt a {
    color: var(--accent-tesla);
}

/* Star Rating Input */
.star-rating {
    display: flex;
    gap: var(--space-xs);
    margin-bottom: var(--space-md);
}

.star-rating-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    transition: all var(--transition-fast);
    cursor: pointer;
}

.star-rating-btn:hover,
.star-rating-btn.active {
    background: rgba(245, 158, 11, 0.1);
}

.star-rating-btn svg {
    width: 24px;
    height: 24px;
    color: var(--text-muted);
    transition: all var(--transition-fast);
}

.star-rating-btn:hover svg,
.star-rating-btn.active svg {
    color: var(--accent-warning);
    fill: var(--accent-warning);
}

.star-rating-btn.preview svg {
    color: var(--accent-warning);
    fill: var(--accent-warning);
}

.review-textarea {
    width: 100%;
    min-height: 100px;
    padding: var(--space-md);
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-md);
    font-size: 14px;
    resize: vertical;
    margin-bottom: var(--space-md);
}

.review-textarea:focus {
    border-color: var(--accent-tesla);
}

.review-char-count {
    font-size: 12px;
    color: var(--text-muted);
    text-align: right;
    margin-bottom: var(--space-md);
}

.submit-review-btn {
    width: 100%;
    padding: var(--space-md);
    background: var(--accent-tesla);
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 600;
    color: white;
    transition: all var(--transition-fast);
}

.submit-review-btn:hover {
    box-shadow: var(--shadow-glow-red);
}

.submit-review-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* Reviews List */
.reviews-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-lg);
}

.review-item {
    padding-bottom: var(--space-lg);
    border-bottom: 1px solid var(--border-glass);
}

.review-item:last-child {
    border-bottom: none;
    padding-bottom: 0;
}

.review-header {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    margin-bottom: var(--space-md);
}

.review-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--gradient-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    color: white;
    overflow: hidden;
}

.review-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.review-user-info {
    flex: 1;
}

.review-user-name {
    font-size: 14px;
    font-weight: 600;
}

.review-meta {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    font-size: 12px;
    color: var(--text-muted);
}

.review-stars {
    display: flex;
    gap: 2px;
}

.review-stars svg {
    width: 14px;
    height: 14px;
    color: var(--accent-warning);
}

.review-content {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
}

/* Empty Reviews */
.reviews-empty {
    text-align: center;
    padding: var(--space-2xl);
}

.reviews-empty-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto var(--space-lg);
    background: var(--bg-tertiary);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.reviews-empty-icon svg {
    width: 32px;
    height: 32px;
    color: var(--text-muted);
}

.reviews-empty-text {
    font-size: 14px;
    color: var(--text-muted);
}

/* --------------------------------------------------------------------------
   Toast Notification
   -------------------------------------------------------------------------- */
.toast {
    position: fixed;
    bottom: var(--space-lg);
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    padding: var(--space-md) var(--space-xl);
    background: var(--bg-secondary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    font-size: 14px;
    z-index: 3000;
    opacity: 0;
    transition: all var(--transition-normal);
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.toast.success {
    border-color: var(--accent-success);
}

.toast.error {
    border-color: var(--accent-tesla);
}

/* --------------------------------------------------------------------------
   Login Modal
   -------------------------------------------------------------------------- */
.login-modal .modal {
    max-width: 400px;
}

.login-options {
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
}

.login-option {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-lg);
    background: var(--bg-tertiary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all var(--transition-fast);
}

.login-option:hover {
    border-color: var(--border-hover);
    transform: translateY(-2px);
}

.login-option-icon {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-secondary);
    border-radius: var(--radius-md);
    font-size: 24px;
}

.login-option-info {
    flex: 1;
}

.login-option-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: var(--space-xs);
}

.login-option-desc {
    font-size: 13px;
    color: var(--text-muted);
}

.login-guest-mode {
    text-align: center;
    padding-top: var(--space-lg);
    border-top: 1px solid var(--border-glass);
}

.login-guest-mode p {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: var(--space-md);
}

.login-guest-btn {
    padding: var(--space-sm) var(--space-lg);
    background: var(--bg-tertiary);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-md);
    font-size: 14px;
    color: var(--text-secondary);
    transition: all var(--transition-fast);
}

.login-guest-btn:hover {
    border-color: var(--border-hover);
    color: var(--text-primary);
}

/* --------------------------------------------------------------------------
   Footer
   -------------------------------------------------------------------------- */
.footer {
    padding: var(--space-4xl);
    background: var(--bg-primary);
}

.footer-container {
    max-width: var(--max-width);
    margin: 0 auto;
}

.footer-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-glass), transparent);
    margin-bottom: var(--space-2xl);
}

.footer-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.footer-copyright {
    font-size: 13px;
    color: var(--text-muted);
}

.footer-links {
    display: flex;
    gap: var(--space-xl);
}

.footer-links a {
    font-size: 13px;
    color: var(--text-muted);
    transition: color var(--transition-fast);
}

.footer-links a:hover {
    color: var(--text-primary);
}

.footer-data-sources {
    margin-top: var(--space-lg);
    padding-top: var(--space-lg);
    border-top: 1px solid var(--border-glass);
    font-size: 12px;
    color: var(--text-muted);
}

.footer-data-sources strong {
    color: var(--text-secondary);
}

/* --------------------------------------------------------------------------
   Loading & Empty States
   -------------------------------------------------------------------------- */
.loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: var(--space-4xl);
    gap: var(--space-lg);
}

.loading-spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border-glass);
    border-top-color: var(--accent-tesla);
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loading-text {
    font-size: 14px;
    color: var(--text-secondary);
}

.empty-state {
    text-align: center;
    padding: var(--space-4xl);
}

.empty-state-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto var(--space-lg);
    background: var(--bg-secondary);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.empty-state-icon svg {
    width: 40px;
    height: 40px;
    color: var(--text-muted);
}

.empty-state-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: var(--space-sm);
}

.empty-state-text {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: var(--space-lg);
}

.empty-state .btn {
    display: inline-flex;
}

/* --------------------------------------------------------------------------
   Animations
   -------------------------------------------------------------------------- */
.animate-in {
    animation: fadeInUp 0.6s ease-out forwards;
}

.animate-delay-1 { animation-delay: 0.1s; }
.animate-delay-2 { animation-delay: 0.2s; }
.animate-delay-3 { animation-delay: 0.3s; }
.animate-delay-4 { animation-delay: 0.4s; }

/* --------------------------------------------------------------------------
   Cyberpunk Theme Special Effects
   -------------------------------------------------------------------------- */
:root[data-theme="cyberpunk"] .skill-card:hover {
    animation: glitch 0.3s ease;
}

@keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-2px, 2px); }
    40% { transform: translate(-2px, -2px); }
    60% { transform: translate(2px, 2px); }
    80% { transform: translate(2px, -2px); }
    100% { transform: translate(0); }
}

:root[data-theme="cyberpunk"] .scanlines {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    z-index: 9999;
    background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.1) 0px,
        rgba(0, 0, 0, 0.1) 1px,
        transparent 1px,
        transparent 2px
    );
    opacity: 0.3;
}

:root[data-theme="cyberpunk"] .neon-text {
    text-shadow: 
        0 0 5px var(--accent-tesla),
        0 0 10px var(--accent-tesla),
        0 0 20px var(--accent-tesla);
}

:root[data-theme="cyberpunk"] .neon-border {
    box-shadow: 
        0 0 5px var(--accent-tesla),
        inset 0 0 5px rgba(0, 255, 245, 0.1);
}

function getStoredUser() {

    localStorage.setItem(STORAGE_KEYS.USER, JSON.stringify(user));

    localStorage.removeItem(STORAGE_KEYS.USER);

function loginWithGitHub() {
    const clientId = localStorage.getItem(STORAGE_KEYS.GITHUB_CLIENT_ID) || 'Ov23liXXXXXXXXXXXXXXX';
    
    // GitHub OAuth URL (device flow for simplicity)
    const authUrl = `https://github.com/login/oauth/authorize?client_id=${clientId}&scope=read:user&redirect_uri=${encodeURIComponent(window.location.origin + window.location.pathname)}`;
    
    // Open in popup or redirect
    const width = 600;
    const height = 700;
    const left = (screen.width - width) / 2;
    const top = (screen.height - height) / 2;
    
    const popup = window.open(
        authUrl,
        'github-auth',
        `width=${width},height=${height},left=${left},top=${top}`
    );
    
    // Listen for OAuth callback
    const checkPopup = setInterval(() => {
        try {
            if (popup.location.href.includes('code=')) {
                const url = new URL(popup.location.href);
                const code = url.searchParams.get('code');
                
                if (code) {
                    // In a real app, you would exchange this code for a token via your backend
                    // For demo purposes, we'll simulate a successful login
                    popup.close();
                    clearInterval(checkPopup);
                    
                    // Simulate getting user info
                    const mockUser = {
                        id: 'github-' + Date.now(),
                        name: 'GitHub User',
                        avatar: 'https://avatars.githubusercontent.com/u/1?v=4',
                        loginType: 'github'
                    };
                    
                    saveUser(mockUser);
                    closeLoginModal();
                    showToast('登录成功！', 'success');
                }
            }
        } catch (e) {
            // Cross-origin error - waiting for redirect
        }
        
        if (popup.closed) {
            clearInterval(checkPopup);
        }
    }, 1000);
    
    // Fallback: check URL params for OAuth code
    const urlParams = new URLSearchParams(window.location.search);
    const authCode = urlParams.get('code');
    if (authCode) {
        // Remove code from URL
        window.history.replaceState({}, document.title, window.location.pathname);
        loginWithGitHub(); // Trigger login flow
    }
}

function loginAsGuest() {
    const guestId = 'guest-' + Date.now();
    const guestUser = {

function getStoredFavorites() {
    const stored = localStorage.getItem(STORAGE_KEYS.FAVORITES);
    return stored ? JSON.parse(stored) : [];
}

function saveFavorites(favorites) {
    localStorage.setItem(STORAGE_KEYS.FAVORITES, JSON.stringify(favorites));
}

function isFavorited(type, id) {
    const favorites = getStoredFavorites();
    return favorites.some(f => f.type === type && f.id === id);
}

function toggleFavorite(type, id, event) {
    if (event) {
        event.stopPropagation();
        event.preventDefault();
    }
    
    if (!state.user && !state.isGuest) {
        showToast('请先登录后再收藏', 'error');
        openLoginModal();
        return;
    }
    
    const favorites = getStoredFavorites();
    const index = favorites.findIndex(f => f.type === type && f.id === id);
    
    if (index > -1) {
        favorites.splice(index, 1);
        saveFavorites(favorites);
        showToast('已取消收藏', 'success');
    } else {
        favorites.push({
            type,
            id,
            timestamp: Date.now()
        });
        saveFavorites(favorites);
        showToast('已添加到收藏', 'success');
    }
    
    // Update UI
    updateFavoriteButtons(type, id);
    updateFavoriteButtonsInPage(type, id);
}

function updateFavoriteButtons(type, id) {
    const btn = document.querySelector(`[data-favorite="${type}-${id}"]`);
    if (btn) {
        const favorited = isFavorited(type, id);
        btn.classList.toggle('favorited', favorited);
        btn.innerHTML = favorited 
            ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>'

    }
}

function updateFavoriteButtonsInPage(type, id) {
    document.querySelectorAll(`[data-favorite="${type}-${id}"]`).forEach(btn => {

function getStoredReviews() {
    const stored = localStorage.getItem(STORAGE_KEYS.REVIEWS);
    return stored ? JSON.parse(stored) : [];
}

function saveReviews(reviews) {
    localStorage.setItem(STORAGE_KEYS.REVIEWS, JSON.stringify(reviews));
}

function getReviewsForItem(itemId) {
    const reviews = getStoredReviews();
    return reviews.filter(r => r.itemId === itemId).sort((a, b) => b.timestamp - a.timestamp);
}

function getAverageRating(itemId) {
    const reviews = getReviewsForItem(itemId);
    if (reviews.length === 0) return null;
    const sum = reviews.reduce((acc, r) => acc + r.rating, 0);
    return (sum / reviews.length).toFixed(1);
}

function submitReview() {
    if (!state.user) {
        showToast('请先登录后再评价', 'error');
        return;
    }
    
    const ratingInput = document.querySelector('.star-rating-btn.active');
    const rating = ratingInput ? parseInt(ratingInput.dataset.rating) : 0;
    const comment = document.getElementById('reviewComment')?.value?.trim() || '';
    
    if (rating === 0) {
        showToast('请选择评分', 'error');
        return;
    }
    
    if (comment.length > 200) {
        showToast('评价内容不能超过200字', 'error');
        return;
    }
    
    const review = {
        itemId: state.currentReviewItem.id,
        itemType: state.currentReviewItem.type,
        userId: state.user.id,
        userName: state.user.name,
        userAvatar: state.user.avatar,
        rating,
        comment,
        timestamp: Date.now()
    };
    
    const reviews = getStoredReviews();
    reviews.push(review);
    saveReviews(reviews);
    
    showToast('评价提交成功！', 'success');
    renderReviewsModal(state.currentReviewItem.type, state.currentReviewItem.id);
    
    // Update rating displays in page
    updateRatingDisplays(state.currentReviewItem.type, state.currentReviewItem.id);
}

function updateRatingDisplays(type, id) {
    const avg = getAverageRating(id);
    const count = getReviewsForItem(id).length;
    
    // Update card rating badge
    const cardRating = document.querySelector(`.card-rating[data-item="${type}-${id}"]`);
    if (cardRating && avg) {
        cardRating.innerHTML = `
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2">
                <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
            </svg>
            ${avg} (${count})
        `;
    }
    
    // Update detail page stats
    const detailRating = document.querySelector(`[data-detail-rating="${id}"]`);
    if (detailRating && avg) {
        detailRating.textContent = avg;
    }
}

function renderReviewsModal(type, id) {
    state.currentReviewItem = { type, id };
    const reviews = getReviewsForItem(id);
    const avg = getAverageRating(id);
    const count = reviews.length;
    
    const body = document.getElementById('reviewsModalBody');
    
    // Calculate rating breakdown
    const breakdown = [5, 4, 3, 2, 1].map(stars => {
        const count = reviews.filter(r => r.rating === stars).length;
        const percent = count > 0 ? (count / (count || 1)) * 100 : 0;
        return { stars, count, percent };
    });
    
    let html = `
        <div class="reviews-stats">
            <div class="reviews-average">
                <div class="reviews-average-value">${avg || '-'}</div>
                ${renderStarsHTML(avg || 0, 16)}
                <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">${count} 条评价</div>
            </div>
            <div class="reviews-breakdown">
                ${breakdown.map(b => `
                    <div class="reviews-breakdown-row">
                        <span>${b.stars}星</span>
                        <div class="reviews-breakdown-bar">
                            <div class="reviews-breakdown-bar-fill" style="width: ${b.percent}%;"></div>
                        </div>
                        <span>${b.count}</span>
                    </div>
                `).join('')}
            </div>
        </div>
        
        <div class="write-review">
            <div class="write-review-header">
                <span class="write-review-title">撰写评价</span>
                ${!state.user ? '<span class="login-prompt"><a href="#" onclick="openLoginModal(); return false;">登录</a> 后参与评价</span>' : ''}
            </div>
            ${state.user ? `
                <div class="star-rating" id="reviewStarRating">
                    ${[1,2,3,4,5].map(n => `
                        <button class="star-rating-btn" data-rating="${n}" 
                                onmouseover="previewStars(${n})" 
                                onmouseout="clearPreview()"
                                onclick="selectStar(${n})">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
                            </svg>
                        </button>
                    `).join('')}
                </div>
                <textarea class="review-textarea" id="reviewComment" placeholder="分享你的使用体验..." maxlength="200"></textarea>
                <div class="review-char-count"><span id="charCount">0</span>/200</div>
                <button class="submit-review-btn" onclick="submitReview()">提交评价</button>
            ` : ''}
        </div>
        
        <div class="reviews-list">
            ${reviews.length > 0 ? reviews.map(review => `
                <div class="review-item">
                    <div class="review-header">
                        <div class="review-avatar">
                            ${review.userAvatar 
                                ? `<img src="${review.userAvatar}" alt="${review.userName}">`
                                : review.userName.charAt(0).toUpperCase()
                            }
                        </div>
                        <div class="review-user-info">
                            <div class="review-user-name">${review.userName}</div>
                            <div class="review-meta">
                                <div class="review-stars">${renderStarsHTML(review.rating, 14)}</div>
                                <span>·</span>
                                <span>${formatDate(review.timestamp)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="review-content">${review.comment || '（无评论）'}</div>
                </div>
            `).join('') : `
                <div class="reviews-empty">
                    <div class="reviews-empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
                        </svg>
                    </div>
                    <p class="reviews-empty-text">还没有人评价，来成为第一个吧！</p>
                </div>
            `}
        </div>
    `;
    
    body.innerHTML = html;
    
    // Add char count listener
    const commentInput = document.getElementById('reviewComment');
    if (commentInput) {
        commentInput.addEventListener('input', () => {
            document.getElementById('charCount').textContent = commentInput.value.length;
        });
    }
}

function formatDate(timestamp) {
    const date = new Date(timestamp);
    const now = new Date();
    const diff = now - date;
    
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
    if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
    
    return date.toLocaleDateString('zh-CN');
}

function renderStarsHTML(rating, size = 14) {
    const fullStars = Math.floor(rating);
    const hasHalf = rating % 1 >= 0.5;
    let html = '';
    
    for (let i = 0; i < 5; i++) {
        if (i < fullStars) {
            html += `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2">
                <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
            </svg>`;
        } else {
            html += `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
            </svg>`;
        }
    }
    
    return html;
}
