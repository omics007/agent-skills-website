// ==========================================================================
// Data Loading
// ==========================================================================

async function loadJSON(filePath) {
    try {
        const response = await fetch(filePath);
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        return await response.json();
    } catch (error) {
        console.error(`Failed to load ${filePath}:`, error);
        return null;
    }
}

async function loadAllData() {
    const main = document.getElementById('mainContent');
    main.innerHTML = `
        <div class="loading" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div class="loading-spinner"></div>
            <p class="loading-text">正在加载数据...</p>
        </div>
    `;
    
    const [skillsData, tutorialsData, newsData] = await Promise.all([
        loadJSON('./data/skills.json'),
        loadJSON('./data/tutorials.json'),
        loadJSON('./data/news.json')
    ]);
    
    if (skillsData) {
        state.skills = skillsData.skills || [];
        state.categories = skillsData.categories || [];
        state.skillsLastUpdated = skillsData.lastUpdated || '';
    }
    
    if (tutorialsData) {
        state.tutorials = tutorialsData.tutorials || [];
        state.tutorialsLastUpdated = tutorialsData.lastUpdated || '';
    }
    
    if (newsData) {
        state.news = newsData.news || [];
        state.newsLastUpdated = newsData.lastUpdated || '';
    }
    
    updateFooterLastUpdated();
    state.dataLoaded = true;
    router();
}

function updateFooterLastUpdated() {
    const lastUpdatedEl = document.getElementById('lastUpdated');
    const dates = [state.skillsLastUpdated, state.tutorialsLastUpdated, state.newsLastUpdated]
        .filter(d => d)
        .sort((a, b) => new Date(b) - new Date(a));
    
    if (dates.length > 0) {
        const latest = new Date(dates[0]);
        const formatted = latest.toLocaleString('zh-CN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
        lastUpdatedEl.textContent = `数据最后更新于：${formatted}`;
    }
}

function router() {
    if (!state.dataLoaded) return;
    
    const hash = window.location.hash || '#/';
    const path = hash.slice(1);
    
    updateActiveNavLinks(path);
    
    // Parse route
    if (path === '/' || path === '') {
        state.currentPage = 'home';
        state.currentSkillId = null;
        renderHome();
    } else if (path === '/skills') {
        state.currentPage = 'skills';
        state.currentSkillId = null;
        renderSkills();
    } else if (path === '/news') {
        state.currentPage = 'news';
        state.currentSkillId = null;
        renderNews();
    } else if (path === '/tutorials') {
        state.currentPage = 'tutorials';
        state.currentSkillId = null;
        renderTutorials();
    } else if (path === '/favorites') {
        state.currentPage = 'favorites';
        state.currentSkillId = null;
        renderFavorites();
    } else if (path === '/settings') {
        state.currentPage = 'settings';
        state.currentSkillId = null;
        renderSettings();
    } else if (path.startsWith('/skill/')) {
        const skillId = path.replace('/skill/', '');
        state.currentPage = 'detail';
        state.currentSkillId = skillId;
        renderSkillDetail(skillId);
    } else {
        state.currentPage = 'home';
        renderHome();
    }
    
    window.scrollTo(0, 0);
}

function updateActiveNavLinks(path) {
    document.querySelectorAll('.nav-link, .mobile-link').forEach(link => {
        link.classList.remove('active');
        const page = link.dataset.page;
        if ((path === '/' && page === 'home') || 
            (path === '/skills' && page === 'skills') ||
            (path === '/news' && page === 'news') ||
            (path === '/tutorials' && page === 'tutorials') ||
            (path === '/favorites' && page === 'favorites') ||
            (path === '/settings' && page === 'settings')) {
            link.classList.add('active');
        }
    });
}

        return tutorial ? { ...tutorial, favoritedAt: f.timestamp } : null;

    const favoriteNews = favorites.filter(f => f.type === 'news').map(f => {
        const news = state.news.find(n => n.id === f.id);

    }).filter(Boolean);
    
    const totalCount = favoriteSkills.length + favoriteTutorials.length + favoriteNews.length;
    
    const html = `
        <div class="page-header">
            <h1 class="page-title">我的收藏</h1>
            <p class="page-subtitle">共 ${totalCount} 个收藏项目</p>

        <div class="favorites-list">
            ${totalCount === 0 ? `
                <div class="empty-state">

                </div>
            ` : `
                ${favoriteSkills.length > 0 ? `
                    <h3 style="font-size: 18px; font-weight: 600; margin-bottom: var(--space-lg);">

function clearFavorites() {

        localStorage.removeItem(STORAGE_KEYS.FAVORITES);
        showToast('收藏已清除', 'success');
        renderSettings();
    }
}

function clearAllData() {
    if (confirm('确定要重置所有数据吗？这将清除所有收藏、评价和设置。此操作不可撤销。')) {
        localStorage.removeItem(STORAGE_KEYS.FAVORITES);
        localStorage.removeItem(STORAGE_KEYS.REVIEWS);
        showToast('所有数据已重置', 'success');
        window.location.hash = '#/';
    }
}

function filterByCategory(category) {
    state.selectedCategory = category || null;
    state.searchQuery = '';
    window.location.hash = '#/skills';
}

function filterBySource(source) {
    state.selectedSource = source || null;
    renderSkills();
}

function filterByTag(tag) {
    if (state.selectedTag === tag) {
        state.selectedTag = null;
    } else {
        state.selectedTag = tag;
    }
    renderSkills();
}

function filterByNewsCategory(category) {
    state.selectedNewsCategory = category || null;
    renderNews();
}

function filterByNewsSource(source) {
    state.selectedNewsSource = source || null;
    renderNews();
}

function filterByTutorialType(type) {
    state.selectedTutorialType = type || null;

}

function filterByTutorialPlatform(platform) {
    state.selectedTutorialPlatform = platform || null;
    renderTutorials();
}

function filterByTutorialDifficulty(difficulty) {

// Search Functions

function performSearch() {
    const heroInput = document.getElementById('heroSearchInput');
    const query = heroInput ? heroInput.value.trim() : '';
    
    if (query) {
        state.searchQuery = query;
        window.location.hash = '#/skills';
    }
}

function performSearchOverlay() {
    const searchInput = document.getElementById('searchInput');
    const query = searchInput.value.trim();
    const resultsContainer = document.getElementById('searchResults');
    
    if (!query) {
        resultsContainer.innerHTML = '';
        return;
    }
    
    // Search in skills
    const matchedSkills = state.skills.filter(skill => 
        skill.name.includes(query) || 
        skill.description.includes(query) ||
        skill.tags.some(tag => tag.includes(query))
    ).slice(0, 5);
    
    // Search in news
    const matchedNews = state.news.filter(news =>
        news.title.includes(query) ||
        news.summary.includes(query)
    ).slice(0, 3);
    
    // Search in tutorials
    const matchedTutorials = state.tutorials.filter(tutorial =>
        tutorial.title.includes(query) ||
        tutorial.description.includes(query)
    ).slice(0, 3);
    
    let html = '';
    
    if (matchedSkills.length > 0) {
        html += `<div class="search-section">
            <h4 class="search-section-title">Skills</h4>
            ${matchedSkills.map(skill => `
                <a href="#/skill/${skill.id}" class="search-result-item" onclick="closeSearchOverlay()">
                    <span class="search-result-icon">${skill.icon}</span>
                    <div class="search-result-info">
                        <span class="search-result-name">${skill.name}</span>
                        <span class="search-result-meta">${skill.source}</span>
                    </div>
                </a>
            `).join('')}
        </div>`;
    }
    
    if (matchedNews.length > 0) {
        html += `<div class="search-section">
            <h4 class="search-section-title">资讯</h4>
            ${matchedNews.map(news => `
                <a href="#/news" class="search-result-item" onclick="closeSearchOverlay()">
                    <span class="search-result-icon">📰</span>
                    <div class="search-result-info">
                        <span class="search-result-name">${news.title}</span>
                        <span class="search-result-meta">${news.source}</span>
                    </div>
                </a>
            `).join('')}
        </div>`;
    }
    
    if (matchedTutorials.length > 0) {
        html += `<div class="search-section">
            <h4 class="search-section-title">教程</h4>
            ${matchedTutorials.map(tutorial => `
                <a href="${tutorial.sourceUrl}" target="_blank" class="search-result-item">
                    <span class="search-result-icon">${tutorial.icon}</span>
                    <div class="search-result-info">
                        <span class="search-result-name">${tutorial.title}</span>
                        <span class="search-result-meta">${getPlatformName(tutorial.platform)}</span>
                    </div>
                </a>
            `).join('')}
        </div>`;
    }
    
    if (!matchedSkills.length && !matchedNews.length && !matchedTutorials.length) {
        html = `<div class="empty-state">
            <p>未找到与"${query}"相关的结果</p>
        </div>`;
    }
    
    resultsContainer.innerHTML = html;
}

function closeSearchOverlay() {
    const searchOverlay = document.getElementById('searchOverlay');
    const searchInput = document.getElementById('searchInput');
    searchOverlay.classList.remove('open');
    searchInput.value = '';
    document.getElementById('searchResults').innerHTML = '';
    document.body.style.overflow = '';
}

// ==========================================================================
// UI Interactions
// ==========================================================================

function initNavbar() {
    const navbar = document.getElementById('navbar');
    
    window.addEventListener('scroll', () => {
        if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });
}

function initMobileMenu() {
    const menuBtn = document.getElementById('navMenuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    let isOpen = false;
    
    menuBtn.addEventListener('click', () => {
        isOpen = !isOpen;
        mobileMenu.classList.toggle('open', isOpen);
        document.body.style.overflow = isOpen ? 'hidden' : '';
    });
    
    // Close on link click
    mobileMenu.querySelectorAll('.mobile-link').forEach(link => {
        link.addEventListener('click', () => {
            isOpen = false;
            mobileMenu.classList.remove('open');
            document.body.style.overflow = '';
        });
    });
}

function initSearch() {
    const searchOverlay = document.getElementById('searchOverlay');
    const searchBtn = document.getElementById('navSearchBtn');
    const searchClose = document.getElementById('searchClose');
    const searchInput = document.getElementById('searchInput');
    
    // Open search
    searchBtn.addEventListener('click', () => {
        searchOverlay.classList.add('open');
        setTimeout(() => searchInput.focus(), 100);
        document.body.style.overflow = 'hidden';
    });
    
    // Close search
    searchClose.addEventListener('click', closeSearchOverlay);
    searchOverlay.addEventListener('click', (e) => {
        if (e.target === searchOverlay) {
            closeSearchOverlay();
        }
    });
    
    // Escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (searchOverlay.classList.contains('open')) {
                closeSearchOverlay();
            }
            closeShareModal();
            closeReviewsModal();
            closeLoginModal();
        }
    });
    
    // Click outside to close dropdowns
    document.addEventListener('click', (e) => {
        const userDropdown = document.getElementById('userDropdown');
        const userMenu = document.getElementById('userMenu');
        
        if (!userMenu.contains(e.target)) {
            userDropdown.classList.remove('open');
        }
    });
    
    // Search input
    let debounceTimer;
    searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(performSearchOverlay, 300);
    });
    
    // Hero search
    const heroInput = document.getElementById('heroSearchInput');
    if (heroInput) {
        heroInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
    }
}

function initModals() {
    // Close modals on overlay click
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                overlay.classList.remove('open');
            }
        });
    });
}

// ==========================================================================
// Initialize App
// ==========================================================================

function init() {
    // Initialize theme
    initTheme();
    
    // Initialize UI
    initNavbar();
    initMobileMenu();
    initSearch();
    initModals();
    
    // Restore user session
    const storedUser = getStoredUser();
    if (storedUser) {
        state.user = storedUser;
        state.isGuest = storedUser.loginType === 'guest';
        updateUserUI();
    }
    
    // Load data first
    loadAllData().then(() => {
        // Then initialize router
        window.addEventListener('hashchange', router);
        router();
    });
}

// Start app when DOM is ready
document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
